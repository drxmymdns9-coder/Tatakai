name: Deploy Tatakai Supabase backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-supabase:
    name: Apply database migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Supabase secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing GitHub secret: SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing GitHub secret: SUPABASE_PROJECT_REF'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing GitHub secret: SUPABASE_DB_PASSWORD'; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the new project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Exclude original-project data wipe migration
        run: |
          mv supabase/migrations/20260928000000_wipe_community_content.sql \
            "$RUNNER_TEMP/20260928000000_wipe_community_content.sql"
          trap 'mv "$RUNNER_TEMP/20260928000000_wipe_community_content.sql" supabase/migrations/' EXIT

      - name: Apply all migrations
        run: supabase db push --linked --include-all

      - name: Deploy Edge Functions
        run: supabase functions deploy send-notification --project-ref "$SUPABASE_PROJECT_REF"
